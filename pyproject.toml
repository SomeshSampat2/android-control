[project]
name = "android-control"
version = "0.1.0"
description = "Lightweight MCP Server for Android Operating System"
readme = "README.md"
requires-python = ">=3.13,<3.14"
keywords = ["android", "mcp", "mobile", "automation"]
dependencies = [
    "fastmcp>=2.14.0",
    "pillow>=11.2.1",
    "tabulate>=0.9.0",
    "typesafe-sdk>=0.6.0",
    "uiautomator2>=3.3.1",
]

[project.scripts]
android-control = "android_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/android_mcp"]
